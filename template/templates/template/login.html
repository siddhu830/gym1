
<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FitPlan</title>

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        .auth-page {
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQjuK1qinCRld13JCTwydloQLJl3NVHZTCKZ2Jy4yjEdQ&s=10);
        background-size: cover;
        background-repeat: no-repeat; 
        background-position: center;
        background-attachment: fixed;
        }

        .auth-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: min(380px, calc(100vw - 32px));
        }

        .auth-brand {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 7px;
            color: white;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .auth-brand > span:last-child {
            color: #69f1df;
        }

        .auth-brand .brand-mark {
            display: grid;
            place-items: center;
            width: 35px;
            height: 35px;
            border-radius: 9px;
            background: #69f1df;
            color: #14221c;
        }

        .auth-card {
            width: 100%;
            box-sizing: border-box;
            padding: 40px;
            border: 2px solid rgba(10, 0, 0, 0.5);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: rgb(33, 29, 29);
            text-align: center;
              box-shadow: 20px 20px 50px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 40px;
            font-size: 32px;
        }

        .form-group {
            margin-bottom: 35px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 2px solid rgb(54, 52, 52);
            background: transparent;
            color: rgb(89, 88, 88);
            outline: none;
        }

        .auth-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .auth-options span {
            cursor: pointer;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background: white;
            color: black;
            font-size: 16px;
            cursor: pointer;
        }
        .auth-button:hover {
            background: #3a3838;
            transform: translatex(-10px) 2s smooth;
            animation: 1s ease-in-out;
            box-shadow: 0 24px 24px #8cae4133;
    
        }
        .auth-switch {
            margin-top: 25px;
            font-size: 14px;
        }
        .auth-switch a:hover {
            color: rgb(77, 73, 73);
        }

        .auth-switch a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

    .nav-wrap {
    display: flex;
    align-items: top;
    justify-content: space-between;
   
    }

.brand {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 25px;
    font-weight: bold;
   
}

.brand > span:last-child {
    color: turquoise;
  
}

.brand-mark {
    display: grid;
    place-items: center;
    background: var(--lime);
    border-radius: 9px;
    font-style: var(--dark);
    opacity: 100%;
}

    </style>
</head>

<body class="auth-page">
    
    <div class="auth-shell">
        <a class="auth-brand" href="{% url 'home' %}" aria-label="FitPlan home">
            <span class="brand-mark">F</span> Fit<span>Plan</span>
        </a>

        <div class="auth-card">

        <h1>Login</h1>

        <form class="auth-form" method="post" action="{% url 'login' %}" id="loginForm">
            {% csrf_token %}
            {% for message in messages %}
                <p role="alert">{{ message }}</p>
            {% endfor %}
          
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>


    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
    </div>

    <div class="auth-options">
        <label>
            <input type="checkbox" name="remember">
            Remember Me
        </label>

        <span>Forgot Password</span>
    </div>

    <button class="auth-button" type="submit">Log In</button>

</form>

        <div class="auth-switch">
            Don't have an account?
            <a href="{% url 'signup' %}">Register</a>
        </div>

        </div>
    </div>

</body>
</html>
